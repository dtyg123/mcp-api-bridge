services:
  mcp-bridge:
    build: .
    image: mcp-api-bridge:latest
    container_name: mcp-api-bridge
    ports:
      - "${BRIDGE_PORT:-8080}:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
      # Leave empty to disable auth on the matching surface.
      BRIDGE_REST_TOKEN: "${BRIDGE_REST_TOKEN:-}"
      BRIDGE_MCP_TOKEN: "${BRIDGE_MCP_TOKEN:-}"
      BRIDGE_ADMIN_TOKEN: "${BRIDGE_ADMIN_TOKEN:-}"
    volumes:
      # Create this file first: cp bridge.config.example.yaml bridge.config.yaml
      - ./bridge.config.yaml:/app/bridge.config.yaml:ro
      # Sources added in the web admin UI (/admin) are persisted here.
      - ./data:/app/data
      # Mount any local OpenAPI specs / data reachable by stdio MCP servers.
      - ./data:/data
    restart: unless-stopped
