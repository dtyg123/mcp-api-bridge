# =============================================================================
#  MCP ⇄ API Bridge 配置示例
#
#  两个方向可以同时启用：
#    apis[]       : REST / OpenAPI 服务  ->  暴露成 MCP Server（HTTP / stdio）
#    mcpServers[] : MCP Server           ->  暴露成 REST / OpenAPI 接口
#
#  所有字符串都支持 ${ENV_VAR} 与 ${ENV_VAR:-默认值} 环境变量插值。
# =============================================================================

server:
  host: 0.0.0.0
  port: 8080
  # 反向代理 / 公网部署时设置，用于生成 /openapi/{output}.json 中的 servers[0].url
  publicBaseUrl: ${PUBLIC_BASE_URL:-}
  # 所有路由的公共前缀，例如 /bridge；留空表示根路径
  basePath: ""
  cors: true
  bodyLimit: 10mb
  requestTimeoutMs: 120000

  auth:
    # 空字符串 = 不启用全局 token。填值后需要 Authorization: Bearer <token>
    rest: ${BRIDGE_REST_TOKEN:-}   # /api/{output}、/openapi/{output}.json 的全局 token
    mcp: ${BRIDGE_MCP_TOKEN:-}     # /mcp/{output} 的全局 token

  # 保护 /admin 管理台与 /admin/api/**。留空 = 不鉴权（本地使用可以，公网务必设置）
  adminToken: ${BRIDGE_ADMIN_TOKEN:-}

  # Web 管理台：可视化添加来源、编辑输出、逐项测试、管理认证信息 / 数据编排
  admin:
    enabled: true
    path: /admin
    # 管理台新增的来源与输出单独存这里，不会改写上面的 YAML
    storeFile: ${BRIDGE_DATA_DIR:-./data}/managed-sources.json
    # 管理台里「粘贴 OpenAPI 文档」时保存到的目录
    specsDir: ${BRIDGE_DATA_DIR:-./data}/specs
    # 同级目录下还会生成：
    #   credentials.json  可复用的认证信息（按名称引用，值以掩码展示）
    #   transforms.json   按 source/tool 保存的返回数据编排

  mcp:
    path: /mcp
    # stateful：维护 Mcp-Session-Id 会话（默认，兼容性最好）
    # stateless：每个请求独立，适合无状态负载均衡
    sessionMode: stateful
    # true 时用 application/json 返回而非 SSE 流
    jsonResponse: false

  rest:
    path: /api

openapi:
  # /openapi/{output}.json 默认输出格式：3.1（JSON Schema 2020-12）或 3.0（兼容性更好）
  version: "3.1"
  title: MCP Bridge API
  description: 由 mcp-api-bridge 依据已注册工具自动生成。

# =============================================================================
#  对外输出（发布的端点）
#
#  来源只是素材；真正对外的是 outputs[]：可组合多个来源、裁剪工具、选形态。
#  某个来源第一次出现时会自动生成一个同名默认输出（转换、MCP + API、全部工具），
#  所以只有 apis / mcpServers 也能直接用 /api/{source}/... 和 /mcp/{source}。
# =============================================================================
# outputs:
#   - name: everything
#     mode: convert              # convert | mirror | proxy
#     form: [mcp, api]           # convert 可双形态；mirror 仅 mcp；proxy 仅 api
#     sources:
#       - source: petstore       # tools 留空 = 该来源全部工具
#       - source: remote-mcp
#         tools: [echo]          # 只暴露这些工具
#     token: ${OUTPUT_TOKEN:-}   # 可选；留空回退全局 token
#     allowCredentialSwitch: false

logging:
  level: ${LOG_LEVEL:-info}   # debug | info | warn | error
  format: text                # text | json

# =============================================================================
#  方向二：API / OpenAPI  ->  MCP
# =============================================================================
apis:
  # 公共演示服务（需要外网）。不需要可直接删掉或注释。
  - name: petstore
    spec: https://petstore3.swagger.io/api/v3/openapi.json
    # 可选：覆盖文档里的 servers[0].url
    baseUrl: https://petstore3.swagger.io/api/v3
    headers:
      User-Agent: mcp-api-bridge
    # 只暴露匹配的操作；{include, exclude} 支持 * 通配符
    # 匹配对象：`GET /pet/{petId}`、`/pet/{petId}`、operationId
    include: []
    exclude: []

  # 需要鉴权的内部服务示例：
  # - name: internal
  #   spec: ./specs/internal.yaml      # 相对路径基于本配置文件所在目录
  #   security:
  #     ApiKeyAuth:  { token: ${INTERNAL_API_KEY} }
  #     BearerAuth:  { token: ${INTERNAL_TOKEN} }
  #     BasicAuth:   { username: ${INTERNAL_USER}, password: ${INTERNAL_PASS} }

  # 复用管理台「认证信息」里的命名凭证（轮换密钥只需改一处）：
  #   凭证类型支持 header / bearer / basic，存于 data/credentials.json。
  #   显式 headers 优先于凭证生成的头，同名（忽略大小写）只保留一份。
  # - name: rainyun
  #   spec: https://api.rainyun.com/openapi.json
  #   credentialRefs: [rainyun]

